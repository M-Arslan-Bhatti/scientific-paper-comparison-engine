[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Long lines in prompt templates / regex patterns aren't worth wrapping.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# sys.path manipulation / load_dotenv() must run before the imports that
# depend on them — intentional ordering, not an oversight.
"frontend/app.py" = ["E402"]
"config/settings.py" = ["E402"]
"evaluate.py" = ["E402", "F401"]
