name: CD

# Builds the image and deploys to ECS Fargate on every push to main, once
# CI has passed. Requires these repo Variables (Settings > Secrets and
# variables > Actions > Variables) to be set by the Terraform step first:
#   AWS_ROLE_ARN        - terraform output: github_actions_role_arn
#   AWS_REGION          - e.g. us-east-1
#   ECR_REPOSITORY_URL  - terraform output: ecr_repository_url
#   ECS_CLUSTER         - terraform output: ecs_cluster_name
#   ECS_SERVICE         - terraform output: ecs_service_name
#   ECS_TASK_FAMILY     - terraform output: ecs_task_family
#
# Until AWS_ROLE_ARN is set, this workflow no-ops (deploy job is skipped)
# so it never blocks CI or fails loudly on a fresh clone.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' > task-definition.json

      - name: Render new task definition with updated image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
