name: CD

# Builds the image and deploys to AWS App Runner on every push to main,
# once CI has passed. Requires these repo Variables (Settings > Secrets and
# variables > Actions > Variables) to be set by the Terraform step first:
#   AWS_ROLE_ARN        - IAM role ARN for GitHub OIDC (terraform output: github_actions_role_arn)
#   AWS_REGION          - e.g. us-east-1
#   ECR_REPOSITORY_URL  - terraform output: ecr_repository_url
#   APP_RUNNER_SERVICE_ARN - terraform output: app_runner_service_arn
#
# Until AWS_ROLE_ARN is set, this workflow no-ops (deploy job is skipped)
# so it never blocks CI or fails loudly on a fresh clone.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy new image to App Runner
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}"
